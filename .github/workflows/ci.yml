name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d pulse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pulse
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-not-a-real-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Audit
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    env:
      SESSION_SECRET: ci-only-not-a-real-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and start the full stack
        run: docker compose --profile full up -d --build

      - name: Wait for the app to answer /api/health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "app is up"
              exit 0
            fi
            sleep 3
          done
          echo "app did not become healthy"
          docker compose logs app
          exit 1

      - name: Confirm the worker is running
        run: |
          for i in $(seq 1 20); do
            if docker compose logs worker 2>/dev/null | grep -q "worker ready"; then
              echo "worker is ready"
              exit 0
            fi
            sleep 3
          done
          echo "worker did not become ready"
          docker compose logs worker
          exit 1

      - name: Seed demo data
        run: docker compose exec -T app npm run db:seed:demo

      - name: Backup/restore round-trip smoke
        run: docker compose exec -T app npm run db:verify-backup
