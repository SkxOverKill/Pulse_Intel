name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d pulse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pulse
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-not-a-real-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Audit
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -t pulse-intel:ci .

      - name: Smoke-test the app container boots
        run: |
          docker run --rm -d --name pulse-ci \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://ci:ci@localhost:5432/pulse \
            -e REDIS_URL=redis://localhost:6379 \
            -e SESSION_SECRET=ci-only-not-a-real-secret \
            -p 3000:3000 pulse-intel:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "app is up"
              docker stop pulse-ci
              exit 0
            fi
            sleep 2
          done
          echo "app did not become healthy"
          docker logs pulse-ci || true
          docker stop pulse-ci || true
          exit 1
