# Deployment target for a VPS, and the local path once Docker is available.
# Not used by the current local dev flow — `npm run db:dev` provides Postgres
# without Docker while hypervisor support is disabled on this machine.
#
#   docker compose up -d postgres redis     # infra only, app via `npm run dev`
#   docker compose --profile full up -d     # everything

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_dev_password}
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Enrichment queue state should survive a restart — an in-flight bulk job
    # that loses its queue silently burns the day's API quota on a retry.
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    profiles: ["full"]
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pulse:${POSTGRES_PASSWORD:-pulse_dev_password}@postgres:5432/pulse
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      NODE_ENV: production
      # Optional enrichment providers — forwarded from the host .env when set.
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      ABUSEIPDB_API_KEYS: ${ABUSEIPDB_API_KEYS:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      GREYNOISE_API_KEY: ${GREYNOISE_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Same image, different command — feed ingestion, enrichment queue, ATT&CK
  # sync. Runs the TypeScript worker entrypoint directly (`src/worker.ts` is
  # executed by tsx, which is a devDependency that ships in the image). Shares
  # src/lib with the app so domain logic is written once.
  worker:
    profiles: ["full"]
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: postgres://pulse:${POSTGRES_PASSWORD:-pulse_dev_password}@postgres:5432/pulse
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      ABUSEIPDB_API_KEYS: ${ABUSEIPDB_API_KEYS:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      GREYNOISE_API_KEY: ${GREYNOISE_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
